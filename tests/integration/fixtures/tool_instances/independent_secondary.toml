version = 1
id = "fixture/secondary"
interface = "verified-read@1"
selector = "SECONDARY_IMPLEMENTATION"
implementation = "graphql.toml"

[defaults]
ENDPOINT = ""

[local]
slot = "ENDPOINT"
output = "fixture/secondary/http"
path = "/graphql"
declaration = "infrastructure.toml"

[infrastructure]
owner = "fixture"
root = "."
declarations = ["infrastructure.toml"]

[bindings]
ENDPOINT = "API_2_ENDPOINT"
HEADERS = "API_2_HEADERS"
PATH = "API_2_PATH"
