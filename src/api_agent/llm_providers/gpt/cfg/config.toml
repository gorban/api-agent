version = 1

[fields.GPT_AUTH_MODE]
type = "str"
enum = ["subscription", "api_key"]
default = "subscription"
help = "Personal subscription sign-in. If you choose subscription, also choose responses for GPT_API_MODE. API-key authentication is pending implementation."

[fields.GPT_API_MODE]
type = "str"
enum = ["responses", "completions"]
conditional_defaults = [{when = {GPT_AUTH_MODE = "subscription"}, value = "responses"}, {when = {GPT_AUTH_MODE = "api_key"}, value = "completions"}]
help = "Subscription authentication requires responses mode."

[fields.GPT_STATE_DIR]
acknowledge_default = false
type = "path"
anchor = "owner_root"
allow_empty = true
default = ""
help = "Protected GPT connection directory. Empty uses ~/.config/api-agent/gpt; saved credentials require owner-only permissions."

[fields.GPT_APP_NAME]
type = "str"
default = "api-agent"
help = "Application display-name hint for first ChatGPT subscription registration. Defaults to api-agent even with a resource pack; override here or in the pack's configuration to name your application, consistently across its installations. Existing registrations keep their issued client ID; changing this value does not rename them."

[fields.LLM_CREDENTIAL_ROLE]
type = "str"
acknowledge_default = false
default = "LLM User"
conditional_defaults = [{when = {GPT_AUTH_MODE = "api_key"}, value = "GPT API Key"}]
help = "Subscription login role for unattended authentication. Configure its account and the shared password manager; the entry username binds reuse to the matching cached OAuth account and fills the observed Email address / Continue step for a new connection. Attended login remains available through Skip. The pending API-key route uses the entry password as its key."

[fields.UNATTENDED_USER_INDEX]
type = "int"
allow_empty = true
validation = "nonnegative"
acknowledge_default = false
help = "Zero-based unattended account selection. Integration [ / ] cycles configured accounts and manual login, saving to the displayed .env; s starts with that choice. Empty means attended; --unattended-user-index= overrides a saved choice for one run. No default index. GPT uses the selected entry username for cached-account matching or the initial email step. Account descriptors and a password manager are required. CLI retrieval failure falls back to attended only when interactive execution or integration DEBUG allows it."
