version = 1

[fields.GPT_AUTH_MODE]
cost_affecting = true
type = "str"
enum = ["subscription", "api_key"]
default = "subscription"
help = "Personal subscription sign-in. If you choose subscription, also choose responses for GPT_API_MODE. API-key mode uses only the selected LLM User password as its key and sets up without a browser. Attended key acquisition is deferred; there is no fallback. Subscription quota readings optionally use a matching native Codex CLI login. launch.py can prepare it on Linux/macOS and present separate attended sign-in; unattended runs require an existing native login. This does not change inference authentication."

[fields.GPT_API_MODE]
cost_affecting = false
type = "str"
enum = ["responses", "completions"]
conditional_defaults = [{when = {GPT_AUTH_MODE = "subscription"}, value = "responses"}, {when = {GPT_AUTH_MODE = "api_key"}, value = "completions"}]
help = "Subscription authentication requires responses mode."

[fields.GPT_BASE_URL]
cost_affecting = true
type = "str"
default = "https://api.openai.com/v1"
applies_when = {GPT_AUTH_MODE = "api_key"}
help = "HTTPS base for API-key requests. For an alternate compatible backend, set its base (for example https://openrouter.ai/api/v1) and select its matching LLM User key. Subscription ignores this setting and uses the fixed official endpoint."

[fields.GPT_STATE_DIR]
type = "path"
anchor = "owner_root"
applies_when = {GPT_AUTH_MODE = "subscription"}
allow_empty = true
default = "~/.config/api-agent/gpt"
help = "Protected GPT connection directory. Default uses ~/.config/api-agent/gpt, independently of GPT_APP_NAME; Review configuration expands it to your current absolute path. An explicit empty value also uses that default. Saved credentials require owner-only permissions."

[fields.GPT_APP_NAME]
type = "str"
applies_when = {GPT_AUTH_MODE = "subscription"}
default = "api-agent"
help = "Application display-name hint for first ChatGPT subscription registration. Defaults to api-agent even with a resource pack; override here or in the pack's configuration to name your application, consistently across its installations. Existing registrations keep their issued client ID; changing this value does not rename them."

[fields.LLM_CREDENTIAL_ROLE]
type = "str"
override = true
override_if_present = true
acknowledge_default = false
default = "LLM User"
help = "LLM credential role for the selected provider and authentication mode. Subscription uses the entry username for cached-account matching and observed login pages, retrieving password/TOTP only when requested. API-key mode uses only the selected LLM User entry password as its key, with browser-free setup. Attended key acquisition is deferred; there is no fallback. Match the selected entry to the configured provider/mode; changing an account index does not change that configuration. Repeat a resource-pack account at matching indexes if several LLM entries use the same pack identity. Attended subscription login remains available through Skip."

[fields.UNATTENDED_USER_INDEX]
type = "int"
allow_empty = true
validation = "nonnegative"
acknowledge_default = false
help = "Zero-based unattended account selection. Integration [ / ] cycles configured accounts and manual login, saving to the displayed .env; s starts with that choice. Empty means attended; --unattended-user-index= overrides a saved choice for one run. No default index. GPT subscription uses the selected entry username for cached-account matching or the initial email step. Match the entry to the selected provider/authentication mode and pair resource-pack entries at the same index. Account descriptors and a password manager are required. Credential retrieval failure stops the selected unattended operation, including interactive and DEBUG runs. Repair password-manager access or explicitly choose manual login with [ / ] or --unattended-user-index=."
