version = 1

[fields.TRACE_EXPORT_ENDPOINT]
type = "str"
conditional_defaults = [{when = {TRACE_MODE = "LangFuse"}, value = "http://localhost:3000/api/public/otel/v1/traces"}, {when = {TRACE_MODE = "OTEL"}, value = "http://localhost:4318/v1/traces"}]
review_optional = true
help = "Complete trace ingestion URL. LangFuse and OTEL defaults use local HTTP/protobuf ingestion. Explicit values, including empty values, are retained; active tracing requires a usable URL. Dashboard URLs are separate."

[fields.TRACE_EXPORT_ENDPOINT.applies_when]
TRACE_MODE = ["LangFuse", "OTEL"]

[fields.TRACE_EXPORT_PROTOCOL]
type = "str"
default = ""
enum = ["", "http/protobuf"]
review_optional = true
help = "Explicit OTLP protocol. The current owned exporter supports http/protobuf; unsupported protocols fail before exporter allocation. Empty permits signal-specific then general OTEL protocol settings."

[fields.TRACE_EXPORT_PROTOCOL.applies_when]
TRACE_MODE = ["LangFuse", "OTEL"]

[fields.TRACE_EXPORT_HEADERS]
type = "str"
default = ""
sensitive = true
review_optional = true
help = "Explicit comma-separated key=value export headers, overriding corresponding standard OTEL header settings. Header values are secret and never appear in tracing reports."

[fields.TRACE_EXPORT_HEADERS.applies_when]
TRACE_MODE = ["LangFuse", "OTEL"]

[fields.TRACE_METRICS]
type = "bool"
default = false
review_optional = true
help = "Opt in to metrics at a separate explicitly supported destination. Managed Jaeger trace ingestion does not accept metrics; configure TRACE_METRICS_ENDPOINT or a signal-specific OTEL metrics endpoint."

[fields.TRACE_METRICS.applies_when]
TRACE_MODE = "OTEL"

[fields.TRACE_METRICS_ENDPOINT]
type = "str"
default = ""
review_optional = true
help = "Complete separate OTLP metric ingestion URL. Required when metrics are enabled unless OTEL_EXPORTER_OTLP_METRICS_ENDPOINT is explicitly supplied; a general OTLP base endpoint is not used by the bundled provider."

[fields.TRACE_METRICS_ENDPOINT.applies_when]
TRACE_MODE = "OTEL"
TRACE_METRICS = true

[fields.TRACE_METRICS_TEMPORALITY]
type = "str"
default = ""
enum = ["", "DELTA", "CUMULATIVE"]
review_optional = true
help = "Explicit metric temporality; otherwise use OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, then CUMULATIVE. Select DELTA for destinations that require it."

[fields.TRACE_METRICS_TEMPORALITY.applies_when]
TRACE_MODE = "OTEL"
TRACE_METRICS = true

[fields.TRACE_RESOURCE_ATTRIBUTES]
type = "jsonobject"
default = {}
review_optional = true
help = "Explicit bounded service/deployment resource identities. These override OTEL_SERVICE_NAME and OTEL_RESOURCE_ATTRIBUTES. The same admitted resource reaches traces and metrics; unsupported custom resource keys fail before SDK allocation."

[fields.TRACE_RESOURCE_ATTRIBUTES.applies_when]
TRACE_MODE = ["LangFuse", "OTEL"]

[fields.TRACE_METRIC_PROFILE]
type = "str"
default = "current"
enum = ["current", "legacy"]
review_optional = true
help = "Pinned GenAI metric vocabulary. Current uses inference duration, usage counters and per-operation token histograms. Legacy uses operation duration and token usage histograms. The profiles are separate and never silently renamed."

[fields.TRACE_METRIC_PROFILE.applies_when]
TRACE_MODE = "OTEL"
TRACE_METRICS = true

[fields.TRACE_MODE]
type = "str"
enum = ["", "LangFuse", "OTEL"]
default = ""
review_optional = true
help = "Trace exporter mode. Empty disables tracing; LangFuse and OTEL select an exporter."

[fields.JAEGER_VIEWER_PORT]
type = "int"
default = 16686
review_optional = true
help = "Loopback host port for the locally managed Jaeger trace viewer; OTLP ingestion remains on port 4318."
[fields.JAEGER_VIEWER_PORT.applies_when]
TRACE_MODE = "OTEL"

[fields.LANGFUSE_ADMIN_EMAIL]
type = "str"
conditional_defaults = [{when = {TRACE_EXPORT_ENDPOINT = ["http://localhost:3000/api/public/otel/v1/traces", "http://127.0.0.1:3000/api/public/otel/v1/traces"]}, value = "admin@local.dev"}]
help = "Administrator email for managed local LangFuse provisioning across Run local and test modes, and Run local dashboard sign-in."
[fields.LANGFUSE_ADMIN_EMAIL.applies_when]
TRACE_MODE = "LangFuse"
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false
[fields.LANGFUSE_ADMIN_EMAIL.required_when]
TRACE_MODE = "LangFuse"
TUI_MODE = "run-local"
COLLECT_ONLY = false

[fields.LANGFUSE_ADMIN_PASSWORD]
type = "str"
conditional_defaults = [{when = {TRACE_EXPORT_ENDPOINT = ["http://localhost:3000/api/public/otel/v1/traces", "http://127.0.0.1:3000/api/public/otel/v1/traces"]}, value = "Local-LF-9vQ7!mR2#xK8@pT4"}]
help = "Administrator password for managed local LangFuse provisioning across Run local and test modes, and Run local dashboard sign-in. Configure the actual existing account; initialization does not reset it."
[fields.LANGFUSE_ADMIN_PASSWORD.applies_when]
TRACE_MODE = "LangFuse"
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false
[fields.LANGFUSE_ADMIN_PASSWORD.required_when]
TRACE_MODE = "LangFuse"
TUI_MODE = "run-local"
COLLECT_ONLY = false

[fields.TRACE_VIEWER_URL]
type = "str"
default = ""
review_optional = true
help = "Optional dashboard URL, separate from trace ingestion. Exact managed local destinations derive their local dashboard when omitted. Explicit empty disables the viewer. A remote/custom collector requires an explicit dashboard URL to open a viewer."
[fields.TRACE_VIEWER_URL.applies_when]
TRACE_MODE = ["LangFuse", "OTEL"]

[fields.LANGFUSE_PUBLIC_KEY]
acknowledge_default = true
type = "str"
conditional_defaults = [{when = {TRACE_EXPORT_ENDPOINT = ["http://localhost:3000/api/public/otel/v1/traces", "http://127.0.0.1:3000/api/public/otel/v1/traces"]}, value = "pk-lf-local-dev-0000000000"}]
help = "LangFuse project public API key for trace ingestion, paired with LANGFUSE_SECRET_KEY; obtain both from the target project settings. Required for an external LangFuse TRACE_EXPORT_ENDPOINT; dashboard email/password do not replace API keys. Managed local LangFuse provisions development defaults automatically. No external default is supplied, so a missing key stops startup."
[fields.LANGFUSE_PUBLIC_KEY.applies_when]
TRACE_MODE = "LangFuse"
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false
[fields.LANGFUSE_PUBLIC_KEY.required_when]
TRACE_MODE = "LangFuse"

[fields.LANGFUSE_SECRET_KEY]
acknowledge_default = true
sensitive = true
type = "str"
conditional_defaults = [{when = {TRACE_EXPORT_ENDPOINT = ["http://localhost:3000/api/public/otel/v1/traces", "http://127.0.0.1:3000/api/public/otel/v1/traces"]}, value = "sk-lf-local-dev-0000000000"}]
help = "LangFuse project secret API key for trace ingestion, paired with LANGFUSE_PUBLIC_KEY; obtain both from the target project settings. Required for an external LangFuse TRACE_EXPORT_ENDPOINT; dashboard email/password do not replace API keys. Managed local LangFuse provisions development defaults automatically. No external default is supplied, so a missing key stops startup. Keep the secret private."
[fields.LANGFUSE_SECRET_KEY.applies_when]
TRACE_MODE = "LangFuse"
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false
[fields.LANGFUSE_SECRET_KEY.required_when]
TRACE_MODE = "LangFuse"

[fields.TRACELOOP_TRACE_CONTENT]
override = true
type = "bool"
default = false
help = "Default False withholds trace payload content. Explicit True permits scrubbed content, including provider-returned plaintext reasoning, in OTEL and LangFuse spans. Does not enable logs, local diagnostics or Allure content; LOG_CONTENT controls those destinations. Credentials, encrypted reasoning and internal state remain excluded."

[fields.TRACELOOP_TRACE_CONTENT.applies_when]
TRACE_MODE = ["LangFuse", "OTEL"]

