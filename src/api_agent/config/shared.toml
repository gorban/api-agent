version = 1

[fields.HELP]
type = "bool"
default = false
help = "Print help and exit before execution configuration validation (-h)."
acknowledge_default = false
persist_default = false

[fields.NO_STD_IN]
type = "bool"
default = false
help = "Disable interactive input after the worktree provenance gate."

[fields.COLLECT_ONLY]
type = "bool"
default = false
help = "Collect test identities without executing tests or prerequisites."

[fields.SKIP_ALLURE_REPORTING]
type = "bool"
default = false
acknowledge_default = false
persist_default = false
help = "Run selected tests without Allure reporting."
[fields.SKIP_ALLURE_REPORTING.applies_when]
TUI_MODE = ["integration", "e2e"]
COLLECT_ONLY = false

[fields.TUI_MODE]
type = "str"
enum = ["run-local", "unit", "integration", "e2e", "allure", "deployment-logs", "config-cleanup", "unattended-auth"]
help = "Select an operation; positional test selectors require an explicit test mode."
[fields.TUI_MODE.required_when]
NO_STD_IN = true

[fields.RUN_UI]
type = "bool"
default = false
help = "Start the optional frontend in Run local. Integration and E2E test browser visibility is controlled by DEBUG, with E2E_DEBUG retained for E2E inspection; E2E always requires its frontend."
[fields.RUN_UI.applies_when]
TUI_MODE = "run-local"
COLLECT_ONLY = false

[fields.UI_SOURCE_DIR]
type = "path"
anchor = "owner_root"
required = true
[fields.UI_SOURCE_DIR.applies_when]
TUI_MODE = ["run-local", "e2e"]
COLLECT_ONLY = false
[[fields.UI_SOURCE_DIR.applies_when_any]]
TUI_MODE = "e2e"
[[fields.UI_SOURCE_DIR.applies_when_any]]
TUI_MODE = "run-local"
RUN_UI = true

[fields.UI_NX_APP]
type = "str"
default = "agent"
[fields.UI_NX_APP.applies_when]
TUI_MODE = ["run-local", "e2e"]
COLLECT_ONLY = false
[[fields.UI_NX_APP.applies_when_any]]
TUI_MODE = "e2e"
[[fields.UI_NX_APP.applies_when_any]]
TUI_MODE = "run-local"
RUN_UI = true

[fields.RUN_LOG_SOURCE]
type = "str"
default = "agent"
help = "Stable active service log source name; all combines streams."
conditional_defaults = [{when = {NO_STD_IN = true}, value = "all"}]
[fields.RUN_LOG_SOURCE.applies_when]
TUI_MODE = "run-local"
COLLECT_ONLY = false

[fields.API_AGENT_DIR]
type = "path"
anchor = "pack_root"
default = "../api-agent"
pack_only = true
help = "Base runtime location, resolved relative to the pack root."

[fields.E2E_RERUNS]
help = "E2E-only retry allowance; unit and integration tests never retry. E2E execution requires human acceptance."
type = "int"
default = 0
validation = "nonnegative"
[fields.E2E_RERUNS.applies_when]
TUI_MODE = "e2e"
COLLECT_ONLY = false

[fields.E2E_DEBUG]
type = "bool"
default = false
acknowledge_default = false
persist_default = false
[fields.E2E_DEBUG.applies_when]
TUI_MODE = "e2e"
COLLECT_ONLY = false

[fields.AUTH_BROWSER_DEBUG]
type = "bool"
default = false
acknowledge_default = false
persist_default = false
[fields.AUTH_BROWSER_DEBUG.applies_when]
TUI_MODE = ["run-local", "integration", "e2e", "unattended-auth"]
COLLECT_ONLY = false

[fields.E2E_BROWSER_RESOLUTION]
type = "str"
default = "1440x900"
validation = "resolution"
[fields.E2E_BROWSER_RESOLUTION.applies_when]
TUI_MODE = "e2e"
COLLECT_ONLY = false

[fields.UNATTENDED_AUTH]
type = "jsonobject"
default = {}
help = "Compact JSON role-to-credential-entry arrays; selected profiles are validated by authentication setup."
[fields.UNATTENDED_AUTH.applies_when]
TUI_MODE = ["run-local", "integration", "e2e", "unattended-auth"]
COLLECT_ONLY = false

[fields.UNATTENDED_SECONDARY_USER]
type = "str"
help = "Optional secondary credential role."
[fields.UNATTENDED_SECONDARY_USER.applies_when]
TUI_MODE = ["run-local", "integration", "e2e", "unattended-auth"]
COLLECT_ONLY = false

[fields.UNATTENDED_USER_INDEX]
type = "int"
validation = "nonnegative"
acknowledge_default = false
persist_default = false
[fields.UNATTENDED_USER_INDEX.applies_when]
TUI_MODE = ["run-local", "integration", "e2e", "unattended-auth"]
COLLECT_ONLY = false
