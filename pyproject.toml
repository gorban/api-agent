[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "api-agent"
version = "0.1.0"
description = "Shared agent runtime and resource-pack development interface"
requires-python = ">=3.13"
dependencies = ["textual>=8.2.8,<9", "Django>=5.2.17,<5.3", "uvicorn>=0.53,<0.54", "packaging>=24,<27", "regex>=2024.11.6,<2027", "httpx>=0.28.1,<0.29", "PyJWT[crypto]>=2.10.1,<3", "langgraph==1.2.14", "langchain-core==1.6.9", "markdown-it-py==4.2.0", "jsonschema==4.26.0"]

[project.optional-dependencies]
bedrock = ["boto3[crt]>=1.41,<2", "openai[bedrock]==3.37.0"]
reports = ["boto3>=1.37.32,<2"]
graphql = ["graphql-core==3.2.13", "mcp==1.30.0"]
browser = ["playwright>=1.63,<1.64", "playwright-stealth==2.0.3"]
tracing = ["opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1", "requests==2.34.2"]
dev = ["graphql-core==3.2.13", "pytest-asyncio==1.4.0", "Authlib>=1.7.2,<1.8", "pytest>=8,<10", "pytest-cov>=6,<8", "pytest-xdist>=3,<4", "build>=1.2,<2", "hatchling>=1.26,<2", "playwright>=1.63,<1.64", "playwright-stealth==2.0.3", "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1", "requests==2.34.2"]

[project.scripts]
api-agent = "api_agent.runtime.bootstrap:cli_main"

[tool.hatch.build.targets.sdist]
only-include = ["LICENSE", "README.md", "pyproject.toml", "hatch_build.py", "launch.py", "package.json", "package-lock.json", "tools/prepare_frontend_assets.mjs", "tools/frontend-assets.json",
  "tools/frontend_assets.py", "src", "demo", "cfg", "infra/compose", "apps/api-agent-ui", "workflows", "flow.md.html", "tests", "docs", "tools/checks.py", "tools/pre_commit_dispatcher.py", "tools/workflow_views.py"]
exclude = [".*", "**/.*", "**/__pycache__/**", "**/node_modules/**", "**/*.pyc"]

[tool.hatch.build.targets.sdist.force-include]
"src/api_agent/api_providers/graphql_mcp/licenses/third-party/body-parser/node_modules/content-type/LICENSE" = "src/api_agent/api_providers/graphql_mcp/licenses/third-party/body-parser/node_modules/content-type/LICENSE"
"src/api_agent/api_providers/graphql_mcp/licenses/third-party/express/node_modules/content-type/LICENSE" = "src/api_agent/api_providers/graphql_mcp/licenses/third-party/express/node_modules/content-type/LICENSE"
"src/api_agent/api_providers/graphql_mcp/licenses/third-party/negotiator/node_modules/content-type/LICENSE" = "src/api_agent/api_providers/graphql_mcp/licenses/third-party/negotiator/node_modules/content-type/LICENSE"
"src/api_agent/api_providers/graphql_mcp/licenses/third-party/type-is/node_modules/content-type/LICENSE" = "src/api_agent/api_providers/graphql_mcp/licenses/third-party/type-is/node_modules/content-type/LICENSE"
".npmrc" = ".npmrc"
"apps/api-agent-ui/public/marked.js" = "apps/api-agent-ui/public/marked.js"
"apps/api-agent-ui/public/dompurify.js" = "apps/api-agent-ui/public/dompurify.js"
".private_resources/diagrams/flow.svg" = ".private_resources/diagrams/flow.svg"
".private_resources/diagrams/flow.md" = ".private_resources/diagrams/flow.md"
".private_resources/diagrams/workflows/components/agent.svg" = ".private_resources/diagrams/workflows/components/agent.svg"
".private_resources/diagrams/workflows/components/agent.md" = ".private_resources/diagrams/workflows/components/agent.md"
".private_resources/viewer/viewer.js" = ".private_resources/viewer/viewer.js"
".private_resources/viewer/flow-modal.js" = ".private_resources/viewer/flow-modal.js"
".private_resources/viewer/flow-modal.css" = ".private_resources/viewer/flow-modal.css"
".private_resources/viewer/svg-links.js" = ".private_resources/viewer/svg-links.js"
".private_resources/viewer/github-slugger-LICENSE.txt" = ".private_resources/viewer/github-slugger-LICENSE.txt"
".private_resources/viewer/heading-id-LICENSE.txt" = ".private_resources/viewer/heading-id-LICENSE.txt"
".private_resources/viewer/heading-id.js" = ".private_resources/viewer/heading-id.js"
".private_resources/viewer/viewer.css" = ".private_resources/viewer/viewer.css"
".private_resources/viewer/marked.js" = ".private_resources/viewer/marked.js"
".private_resources/viewer/dompurify.js" = ".private_resources/viewer/dompurify.js"
".private_resources/viewer/marked-LICENSE.txt" = ".private_resources/viewer/marked-LICENSE.txt"
".private_resources/viewer/dompurify-LICENSE.txt" = ".private_resources/viewer/dompurify-LICENSE.txt"
".private_resources/viewer/PlantUML-NOTICE.txt" = ".private_resources/viewer/PlantUML-NOTICE.txt"
".private_resources/viewer/VIEWER-ASSET-NOTICE.txt" = ".private_resources/viewer/VIEWER-ASSET-NOTICE.txt"

[tool.hatch.build.targets.wheel]
packages = ["src/api_agent"]
exclude = ["src/api_agent/config/shared.toml", "demo/config.toml"]

[tool.hatch.build.targets.wheel.force-include]
"src/api_agent/api_providers/graphql_mcp/licenses/third-party/body-parser/node_modules/content-type/LICENSE" = "api_agent/api_providers/graphql_mcp/licenses/third-party/body-parser/node_modules/content-type/LICENSE"
"src/api_agent/api_providers/graphql_mcp/licenses/third-party/express/node_modules/content-type/LICENSE" = "api_agent/api_providers/graphql_mcp/licenses/third-party/express/node_modules/content-type/LICENSE"
"src/api_agent/api_providers/graphql_mcp/licenses/third-party/negotiator/node_modules/content-type/LICENSE" = "api_agent/api_providers/graphql_mcp/licenses/third-party/negotiator/node_modules/content-type/LICENSE"
"src/api_agent/api_providers/graphql_mcp/licenses/third-party/type-is/node_modules/content-type/LICENSE" = "api_agent/api_providers/graphql_mcp/licenses/third-party/type-is/node_modules/content-type/LICENSE"
".private_resources/diagrams/flow.svg" = "api_agent/.private_resources/diagrams/flow.svg"
".private_resources/diagrams/flow.md" = "api_agent/.private_resources/diagrams/flow.md"
".private_resources/diagrams/workflows/components/agent.svg" = "api_agent/.private_resources/diagrams/workflows/components/agent.svg"
".private_resources/diagrams/workflows/components/agent.md" = "api_agent/.private_resources/diagrams/workflows/components/agent.md"
"demo" = "api_agent/demo"
"flow.md.html" = "api_agent/flow.md.html"
"workflows" = "api_agent/workflows"
"cfg" = "api_agent/cfg"
"infra/compose" = "api_agent/infra/compose"
"apps/api-agent-ui" = "api_agent/ui/app"
".private_resources/viewer/viewer.js" = "api_agent/.private_resources/viewer/viewer.js"
".private_resources/viewer/flow-modal.js" = "api_agent/.private_resources/viewer/flow-modal.js"
".private_resources/viewer/flow-modal.css" = "api_agent/.private_resources/viewer/flow-modal.css"
".private_resources/viewer/svg-links.js" = "api_agent/.private_resources/viewer/svg-links.js"
".private_resources/viewer/github-slugger-LICENSE.txt" = "api_agent/.private_resources/viewer/github-slugger-LICENSE.txt"
".private_resources/viewer/heading-id-LICENSE.txt" = "api_agent/.private_resources/viewer/heading-id-LICENSE.txt"
".private_resources/viewer/heading-id.js" = "api_agent/.private_resources/viewer/heading-id.js"
".private_resources/viewer/viewer.css" = "api_agent/.private_resources/viewer/viewer.css"
".private_resources/viewer/marked.js" = "api_agent/.private_resources/viewer/marked.js"
".private_resources/viewer/dompurify.js" = "api_agent/.private_resources/viewer/dompurify.js"
".private_resources/viewer/marked-LICENSE.txt" = "api_agent/.private_resources/viewer/marked-LICENSE.txt"
".private_resources/viewer/dompurify-LICENSE.txt" = "api_agent/.private_resources/viewer/dompurify-LICENSE.txt"
".private_resources/viewer/PlantUML-NOTICE.txt" = "api_agent/.private_resources/viewer/PlantUML-NOTICE.txt"
".private_resources/viewer/VIEWER-ASSET-NOTICE.txt" = "api_agent/.private_resources/viewer/VIEWER-ASSET-NOTICE.txt"

# The hook adds only Git-listed owner files and validated npm originals;
# its finite sidecar preserves those paths during no-Git sdist rebuilding.
[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-markers"
markers = ["requires_pack_api: selected integration requires the pack API and identity preflight",
    "feature(name): explicit functional feature for reporting",
    "requires_ui_session: selected integration consumes the UI provider",
    "requires_llm: selected integration consumes an LLM provider"]

[tool.coverage.run]
source = ["api_agent"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
