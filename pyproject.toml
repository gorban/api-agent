[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "api-agent"
version = "0.1.0"
description = "Shared agent runtime and resource-pack development interface"
requires-python = ">=3.13"
dependencies = ["textual>=8.2.8,<9", "Django>=5.2.17,<5.3", "uvicorn>=0.53,<0.54", "packaging>=24,<27", "regex>=2024.11.6,<2027", "httpx>=0.28.1,<0.29", "PyJWT[crypto]>=2.10.1,<3", "langgraph==1.2.14", "langchain-core==1.6.9", "markdown-it-py==4.2.0", "jsonschema==4.26.0"]

[project.optional-dependencies]
reports = ["boto3>=1.37.32,<2"]
graphql = ["graphql-core==3.2.13", "mcp==1.30.0"]
browser = ["playwright>=1.63,<1.64", "playwright-stealth==2.0.3"]
tracing = ["opentelemetry-sdk==1.45.0", "opentelemetry-exporter-otlp-proto-http==1.45.0", "requests==2.34.2"]
dev = ["Authlib>=1.7.2,<1.8", "pytest>=8,<10", "pytest-cov>=6,<8", "pytest-xdist>=3,<4", "build>=1.2,<2", "hatchling>=1.26,<2", "playwright>=1.63,<1.64", "playwright-stealth==2.0.3", "opentelemetry-sdk==1.45.0", "opentelemetry-exporter-otlp-proto-http==1.45.0", "requests==2.34.2"]

[project.scripts]
api-agent = "api_agent.runtime.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api_agent"]
exclude = ["src/api_agent/config/shared.toml", "demo/config.toml"]

[tool.hatch.build.targets.wheel.force-include]
"demo" = "api_agent/demo"
"cfg" = "api_agent/cfg"
"infra/compose" = "api_agent/infra/compose"
"apps/api-agent-ui" = "api_agent/ui/app"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-markers"
markers = ["requires_pack_api: selected integration requires the pack API and identity preflight"]

[tool.coverage.run]
source = ["api_agent"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
