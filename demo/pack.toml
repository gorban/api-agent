version = 1
service_name = "api-agent"
id = "demo"
owner = ".."
config = "simple/cfg/config.toml"
production = ["simple"]

[workflow]
version = 1
root = "base"
entry = "demo/simple/flow.md.html"

[workflow.artifact]
plan = ".private_resources/plans/useful_api_demo.json"
graph_id = "useful_api_demo"
wheels = [".private_resources/wheels/api_agent_demo_bindings-0.1.0-py3-none-any.whl"]

[infrastructure]
version = 1
declarations = ["api/infrastructure.toml"]
inventory = [{owner = "fixture", root = "base", directory = "tests/integration/fixtures/tool_instances", declarations = ["infrastructure.toml"]}]

[tests]
unit = ["tests/unit"]
integration = ["tests/integration"]
e2e = ["tests/e2e"]

[defaults]
UI_NX_APP = "agent"

[tooling]
version = 1
catalog = "tool_catalog.toml"
