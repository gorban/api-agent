# Source-controlled configuration declarations and defaults.
# Put your non-default values in ../.env, environment variables, or CLI options.
# Values from ../.env are loaded first; if the selected resource pack has overlapping
# .env values, it will override api-agent. Environment variables override both,
# and CLI options override everything.

version = 1

[fields.TRACE_MODE]
type = "str"
enum = ["", "LangFuse", "OTEL"]
review_optional = true
help = "Trace exporter mode. Empty disables tracing; LangFuse and OTEL select an exporter."

[fields.TRACE_TARGET]
type = "str"
review_optional = true
conditional_defaults = [{when = {TRACE_MODE = "LangFuse"}, value = "http://localhost:3000"}, {when = {TRACE_MODE = "OTEL"}, value = "http://localhost:4318/v1/traces"}]
help = "Optional trace destination. Defaults to the selected trace mode's local endpoint."

[fields.LOG_CONTENT]
type = "bool"
default = false
help = "Only explicitly setting LOG_CONTENT=True enables message and tool content logging; tracing does not enable content logging."

[fields.HELP]
type = "bool"
default = false
help = "Print help and exit before execution configuration validation (-h)."
acknowledge_default = false
persist_default = false

[fields.NO_STD_IN]
type = "bool"
default = false
acknowledge_default = false
persist_default = false
help = "Disable interactive input; used for scripted access like from CI or Agents."

[fields.COLLECT_ONLY]
type = "bool"
default = false
acknowledge_default = false
persist_default = false
help = "Collect test identities without executing tests or prerequisites."

[fields.TUI_MODE]
type = "str"
enum = ["run-local", "unit", "integration", "e2e", "allure", "deployment-logs", "config-cleanup", "cleanup-containers", "unattended-auth"]
help = "Select an operation; positional test selectors require an explicit test mode."
[fields.TUI_MODE.required_when]
NO_STD_IN = true

[fields.RUN_UI]
type = "bool"
default = false
help = "Start the UI in local runs; in E2E, show the browser while tests run. E2E always starts its UI, and E2E_DEBUG also shows and retains the browser."
[fields.RUN_UI.applies_when]
TUI_MODE = ["run-local", "e2e"]
COLLECT_ONLY = false

[fields.UI_SOURCE_DIR]
acknowledge_default = false
persist_default = false
type = "path"
anchor = "owner_root"
required = true
[fields.UI_SOURCE_DIR.applies_when]
any = [{TUI_MODE = "e2e"}, {TUI_MODE = "run-local", RUN_UI = true}]
COLLECT_ONLY = false

[fields.UI_NX_APP]
acknowledge_default = false
persist_default = false
type = "str"
default = "agent"
[fields.UI_NX_APP.applies_when]
any = [{TUI_MODE = "e2e"}, {TUI_MODE = "run-local", RUN_UI = true}]
COLLECT_ONLY = false

[fields.RUN_LOG_SOURCE]
type = "str"
default = "agent"
help = "Stable active service log source name; all combines streams."
conditional_defaults = [{when = {NO_STD_IN = true}, value = "all"}]
[fields.RUN_LOG_SOURCE.applies_when]
TUI_MODE = "run-local"
COLLECT_ONLY = false

[fields.API_AGENT_DIR]
acknowledge_default = false
persist_default = false
type = "path"
anchor = "pack_root"
default = "../api-agent"
pack_only = true
help = "Base runtime location, resolved relative to the pack root."

[fields.TEST_PARALLEL_JOBS]
type = "int"
default = 8
validation = "nonnegative"
help = "Number of parallel test workers. Set to 0 to disable parallelism and run tests serially."
[fields.TEST_PARALLEL_JOBS.applies_when]
TUI_MODE = ["unit", "integration", "e2e"]
COLLECT_ONLY = false

[fields.E2E_RERUNS]
help = "E2E-only retry allowance; unit and integration tests never retry. E2E execution requires human acceptance. Set to 0 to turn off."
type = "int"
default = 2
validation = "nonnegative"
[fields.E2E_RERUNS.applies_when]
TUI_MODE = "e2e"
COLLECT_ONLY = false

[fields.E2E_DEBUG]
type = "bool"
default = false
acknowledge_default = false
persist_default = false
[fields.E2E_DEBUG.applies_when]
TUI_MODE = "e2e"
COLLECT_ONLY = false

[fields.AUTH_BROWSER_DEBUG]
type = "bool"
default = false
acknowledge_default = false
persist_default = false
[fields.AUTH_BROWSER_DEBUG.applies_when]
TUI_MODE = ["run-local", "integration", "e2e", "unattended-auth"]
COLLECT_ONLY = false

[fields.E2E_BROWSER_RESOLUTION]
type = "str"
default = "1440x900"
validation = "resolution"
[fields.E2E_BROWSER_RESOLUTION.applies_when]
TUI_MODE = "e2e"
COLLECT_ONLY = false

[fields.UNATTENDED_AUTH]
type = "jsonobject"
default = {}
help = "Compact JSON object with shared password_manager (manager and cli_path) and roles (account arrays with vault and user). The selected LLM provider declares its primary role key. A selected resource pack may declare additional role keys. Selected accounts are validated by authentication setup."
[fields.UNATTENDED_AUTH.applies_when]
TUI_MODE = ["run-local", "integration", "e2e", "unattended-auth"]
COLLECT_ONLY = false

# OAuth transport configuration; no provider calls occur during config review.


[fields.LLM_PROVIDER]
type = "str"
review_optional = true
help = "Required factory location (file.py:factory) for executable LLM operations; no default provider is selected."
