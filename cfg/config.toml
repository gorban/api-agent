# Source-controlled configuration declarations and defaults.
# Put your non-default values in ../.env, environment variables, or CLI options.
# Values from ../.env are loaded first; if the selected resource pack has overlapping
# .env values, it will override api-agent. Environment variables override both,
# and CLI options override everything.

# acknowledge_default defaults to true. False hides a field from Review
# configuration; explicit .env, environment and CLI assignments still work.
version = 1

[fields.LLM_ALLOWED_MODELS]
type = "str"
validation = "regex"
default = '(?:openai/)?gpt-6(?:\.\d+)*-(?:luna|haiku|sol)(?:-\d{4}-\d{2}-\d{2})?'
help = "Full model-ID regular expression used by the shared agent to filter catalogs and reject disallowed inference before authentication. Default allows GPT-6 Luna, Haiku and Sol, excluding Astra. Alternation is supported; .* is a wildcard, while \\* matches a literal asterisk. Override for another model family/provider."

[fields.LLM_DEFAULT_MODEL]
cost_affecting = true
type = "str"
validation = "regex"
default = '(?:openai/)?gpt-6(?:\.\d+)*-luna(?:-\d{4}-\d{2}-\d{2})?'
help = "Full model-ID regular expression for the default model. A single allowed match is selected directly. Multiple matches must share a provider-described family and comparable versions; select the unique highest version. No match, missing comparison metadata or a highest-version tie errors rather than switching models. Default selects GPT-6 Luna. Automatic resolution requires catalog access; explicit allowed model calls do not."

[fields.LLM_CACHE_POLICY]
cost_affecting = true
type = "str"
enum = ["", "off", "medium", "high"]
default = ""
help = "Prompt-cache policy. Empty uses provider defaults; off disables prompt caching; medium uses the shortest supported retention; high uses the longest supported retention. Providers reject policies they cannot honor. GPT subscription requires empty policy. Newer OpenAI API-key selections use 30m for both medium and high; eligible older selections use in_memory or 24h. This does not change authentication-state caching or cache completed answers."

[fields.TRACE_MODE]
type = "str"
enum = ["", "LangFuse", "OTEL"]
review_optional = true
help = "Trace exporter mode. Empty disables tracing; LangFuse and OTEL select an exporter."

[fields.TRACE_TARGET]
type = "str"
review_optional = true
conditional_defaults = [{when = {TRACE_MODE = "LangFuse"}, value = "http://localhost:3000"}, {when = {TRACE_MODE = "OTEL"}, value = "http://localhost:4318/v1/traces"}]
help = "Optional trace destination. Defaults to the selected trace mode's local endpoint."

[fields.LOG_CONTENT]
type = "bool"
default = false
help = "Default False omits raw prompts, responses and tool content from logs, traces and Allure. Set True to retain inference request/response attachments and content, including paths and code internals. Credentials and registered secrets are always redacted; tracing does not enable content logging."

[fields.CLIENT_CA_FILE]
acknowledge_default = false
type = "path"
anchor = "owner_root"
review_optional = true
help = "Optional public CA bundle added to verified HTTP clients. Local HTTPS preparation supplies its public mkcert CA automatically; certificate and hostname verification stay enabled."
[fields.CLIENT_CA_FILE.applies_when]
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false

[fields.LANGFUSE_PUBLIC_KEY]
acknowledge_default = false
type = "str"
conditional_defaults = [{when = {TRACE_TARGET = ["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:3000/", "http://127.0.0.1:3000/"]}, value = "pk-lf-local-dev-0000000000"}]
help = "LangFuse public API key. The local Compose service provisions the local development pair; provide your project's keys for a remote target."
[fields.LANGFUSE_PUBLIC_KEY.applies_when]
TRACE_MODE = "LangFuse"
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false
[fields.LANGFUSE_PUBLIC_KEY.required_when]
TRACE_MODE = "LangFuse"

[fields.LANGFUSE_SECRET_KEY]
acknowledge_default = false
type = "str"
conditional_defaults = [{when = {TRACE_TARGET = ["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:3000/", "http://127.0.0.1:3000/"]}, value = "sk-lf-local-dev-0000000000"}]
help = "LangFuse secret API key. The local default is only a development credential; remote targets require an explicit project secret."
[fields.LANGFUSE_SECRET_KEY.applies_when]
TRACE_MODE = "LangFuse"
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false
[fields.LANGFUSE_SECRET_KEY.required_when]
TRACE_MODE = "LangFuse"

[fields.HELP]
type = "bool"
default = false
help = "Print help and exit before execution configuration validation (-h)."
acknowledge_default = false

[fields.NO_STD_IN]
type = "bool"
default = false
acknowledge_default = false
help = "Disable interactive input; used for scripted access like from CI or Agents."

[fields.COLLECT_ONLY]
type = "bool"
default = false
acknowledge_default = false
help = "Collect test identities without executing tests or prerequisites."

[fields.START]
type = "str"
enum = ["", "False", "True", "E2E"]
default = "False"
acknowledge_default = false
help = "True starts the selected operation after startup configuration and permits NO_STD_IN integration execution. E2E also accepts E2E execution, including with NO_STD_IN=True. False or empty disables automatic interactive startup; bare --start means True."

[fields.TUI_MODE]
acknowledge_default = false
type = "str"
enum = ["run-local", "unit", "integration", "e2e", "allure", "deployment-logs", "config-cleanup", "cleanup-containers", "unattended-auth"]
help = "Select an operation; positional test selectors require an explicit test mode."
[fields.TUI_MODE.required_when]
NO_STD_IN = true

[fields.RUN_UI]
type = "bool"
default = false
help = "Start the UI in local runs; in integration, show unattended provider-login browsers; in E2E, show the browser while tests run. False keeps unattended login headless; attended login is always visible. Integration DEBUG or E2E_DEBUG also shows and retains the relevant browser. E2E always starts its UI."
[fields.RUN_UI.applies_when]
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false

[fields.UI_SOURCE_DIR]
acknowledge_default = false
type = "path"
anchor = "owner_root"
required = true
[fields.UI_SOURCE_DIR.applies_when]
any = [{TUI_MODE = "e2e"}, {TUI_MODE = "run-local", RUN_UI = true}]
COLLECT_ONLY = false

[fields.UI_NX_APP]
acknowledge_default = false
type = "str"
default = "agent"
[fields.UI_NX_APP.applies_when]
any = [{TUI_MODE = "e2e"}, {TUI_MODE = "run-local", RUN_UI = true}]
COLLECT_ONLY = false

[fields.RUN_LOG_SOURCE]
type = "str"
default = "agent"
help = "Stable active service log source name; all combines streams."
conditional_defaults = [{when = {NO_STD_IN = true}, value = "all"}]
[fields.RUN_LOG_SOURCE.applies_when]
TUI_MODE = "run-local"
COLLECT_ONLY = false

[fields.API_AGENT_DIR]
acknowledge_default = false
type = "path"
anchor = "pack_root"
default = "../api-agent"
pack_only = true
help = "Base runtime location, resolved relative to the pack root."

[fields.TEST_PARALLEL_JOBS]
type = "int"
default = 8
validation = "nonnegative"
help = "Global parallel test worker count. Unit tests may override it with UNIT_TEST_PARALLEL_JOBS. Set to 0 to disable parallelism and run tests serially."
[fields.TEST_PARALLEL_JOBS.applies_when]
TUI_MODE = ["unit", "integration", "e2e"]
COLLECT_ONLY = false

[fields.UNIT_TEST_PARALLEL_JOBS]
type = "int"
allow_empty = true
default = 32
validation = "nonnegative"
help = "Unit-test worker override. Empty inherits TEST_PARALLEL_JOBS; 0 runs units serially. Integration/E2E continue to use TEST_PARALLEL_JOBS."
[fields.UNIT_TEST_PARALLEL_JOBS.applies_when]
TUI_MODE = "unit"
COLLECT_ONLY = false

[fields.E2E_RERUNS]
help = "E2E-only retry allowance; unit and integration tests never retry. E2E execution requires its human-acceptance screen or explicit START=E2E. Set to 0 to turn off."
type = "int"
default = 2
validation = "nonnegative"
[fields.E2E_RERUNS.applies_when]
TUI_MODE = "e2e"
COLLECT_ONLY = false

[fields.E2E_DEBUG]
type = "bool"
default = false
acknowledge_default = false
[fields.E2E_DEBUG.applies_when]
TUI_MODE = "e2e"
COLLECT_ONLY = false

[fields.DEBUG]
type = "bool"
default = false
acknowledge_default = false
help = "Integration authentication debug: run serially and retain provider login browsers until their windows are closed. With NO_STD_IN, DEBUG can start selected integration tests without START; browser login can still require human interaction. E2E requires its human-acceptance screen unless explicitly accepted with START=E2E."
[fields.DEBUG.applies_when]
TUI_MODE = "integration"
COLLECT_ONLY = false

[fields.E2E_BROWSER_RESOLUTION]
type = "str"
default = "1440x900"
validation = "resolution"
[fields.E2E_BROWSER_RESOLUTION.applies_when]
TUI_MODE = "e2e"
COLLECT_ONLY = false

[fields.SKIP_UNATTENDED_SETUP]
type = "bool"
default = false
acknowledge_default = false
help = "Remember Skip on the startup unattended-authentication suggestion. True suppresses that suggestion for attended login; it does not configure unattended credentials or prevent opening Setup unattended authentication from the menu. Delete its .env assignment to restore the suggestion."

[fields.UNATTENDED_AUTH]
acknowledge_default = false
type = "jsonobject"
default = {}
help = "Compact JSON object with shared password_manager (manager and cli_path) and roles (account arrays with vault and user). The selected LLM provider declares its primary role key. A selected resource pack may declare additional role keys. Selected accounts are validated by authentication setup."
[fields.UNATTENDED_AUTH.applies_when]
TUI_MODE = ["run-local", "integration", "e2e", "unattended-auth"]
COLLECT_ONLY = false

# Provider contributions do not execute authentication during configuration review.

[fields.ALLURE_S3_USE_LOCALSTACK]
type = "bool"
default = false
help = "Use managed local S3 for result history. True defaults the bucket to allure-results and endpoint to http://localhost:4566, and provisions the selected bucket idempotently. Remote S3 requires False and an explicit bucket."
[fields.ALLURE_S3_USE_LOCALSTACK.applies_when]
TUI_MODE = ["integration", "e2e", "allure"]
COLLECT_ONLY = false

[fields.ALLURE_S3_BUCKET]
type = "str"
conditional_defaults = [{when = {ALLURE_S3_USE_LOCALSTACK = true}, value = "allure-results"}]
help = "Required S3 bucket for integration/E2E result history. LocalStack may provide local S3."
[fields.ALLURE_S3_BUCKET.required_when]
TUI_MODE = ["integration", "e2e"]
[fields.ALLURE_S3_BUCKET.applies_when]
TUI_MODE = ["integration", "e2e", "allure"]
COLLECT_ONLY = false

[fields.ALLURE_S3_PREFIX]
type = "str"
default = "allure"
help = "S3 prefix for separate repository/run histories. Existing runs are retained."
[fields.ALLURE_S3_PREFIX.applies_when]
TUI_MODE = ["integration", "e2e", "allure"]
COLLECT_ONLY = false

[fields.ALLURE_S3_ENDPOINT]
type = "str"
conditional_defaults = [{when = {ALLURE_S3_USE_LOCALSTACK = true}, value = "http://localhost:4566"}]
help = "Optional S3-compatible endpoint, such as LocalStack; omitted uses AWS S3."
[fields.ALLURE_S3_ENDPOINT.applies_when]
TUI_MODE = ["integration", "e2e", "allure"]
COLLECT_ONLY = false

[fields.ALLURE_S3_REGION]
type = "str"
default = "us-east-1"
help = "AWS signing region for result storage, including LocalStack."
[fields.ALLURE_S3_REGION.applies_when]
TUI_MODE = ["integration", "e2e", "allure"]
COLLECT_ONLY = false

[fields.ALLURE_RESULTS_DIR]
type = "path"
anchor = "owner_root"
allow_empty = true
default = "artifacts/allure"
help = "Local working directory for isolated recorded run artifacts and manifests. Explicitly empty disables retained local working results; required S3 history uses temporary staging that is cleaned after the run. Relative paths resolve against the test-owner repository."
[fields.ALLURE_RESULTS_DIR.applies_when]
TUI_MODE = ["integration", "e2e", "allure"]
COLLECT_ONLY = false

[fields.ALLURE_SECONDARY_DIR]
type = "path"
anchor = "owner_root"
allow_empty = true
review_optional = true
help = "Optional directory for an additional copy of finalized Allure artifacts and manifests, organized by repository/run ID. When unset or explicitly empty, no additional copy is written; required S3 history remains. Relative paths resolve against the test-owner repository."
[fields.ALLURE_SECONDARY_DIR.applies_when]
TUI_MODE = ["integration", "e2e"]
COLLECT_ONLY = false

[fields.TOKEN_USAGE_CSV_ENABLED]
type = "bool"
default = false
help = "Enable the cumulative token-usage CSV in TOKEN_USAGE_CSV. Default False disables this extra file, even if a path is configured; recorded suites retain their own token-usage artifacts. True defaults the path to token_usage.csv in the selected resource pack root, or api-agent root without a resource pack. An explicitly empty path still disables the file."
[fields.TOKEN_USAGE_CSV_ENABLED.applies_when]
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false

[fields.TOKEN_USAGE_CSV]
type = "path"
anchor = "owner_root"
allow_empty = true
review_optional = true
conditional_defaults = [{when = {TOKEN_USAGE_CSV_ENABLED = true}, value = "token_usage.csv"}]
help = "Optional cumulative CSV path, used only when TOKEN_USAGE_CSV_ENABLED=True. Its conditional default is token_usage.csv in the selected resource pack root, or api-agent root without a resource pack. When unset with the toggle off, or explicitly empty even with the toggle on, no cumulative CSV is written; recorded suites retain their own token-usage CSV and usage-summary artifacts in Allure/S3. Relative overrides resolve against the operation-owner repository."
[fields.TOKEN_USAGE_CSV.applies_when]
TUI_MODE = ["run-local", "integration", "e2e"]
COLLECT_ONLY = false


[fields.LLM_PROVIDER]
type = "str"
review_optional = true
help = "Replaceable LLMProvider version-1 factory (file.py:factory). The bundled GPT provider supports lazy subscription/API-key setup, authenticated catalog discovery and text completion. Any adapter implementing that interface may replace it."

[fields.LLM_CREDENTIAL_ROLE]
type = "str"
default = "LLM User"
acknowledge_default = false
help = "The selected LLM provider's password-manager role. Providers override this to empty when no vault login is needed, or supply their own role label."

[fields.API_PROVIDER]
acknowledge_default = false
type = "str"
review_optional = true
help = "Replaceable APIProvider version-1 factory (file.py:factory), required when an operation invokes an upstream API. Any adapter implementing that interface may be selected, including GraphQL or REST."

[fields.UI_PROVIDER]
acknowledge_default = false
type = "str"
review_optional = true
help = "Replaceable UIProvider version-1 frontend lifecycle factory (file.py:factory), selected by the resource pack or an explicit override. Any adapter implementing that interface may replace it."

[fields.ACCESS_PROVIDER]
acknowledge_default = false
type = "str"
review_optional = true
help = "Replaceable AccessProvider version-1 factory (file.py:factory), independently selected for non-inference checks. Any adapter implementing discovery/usage access capabilities may replace it; it cannot advertise inference."

[fields.AGENT_DJANGO_URL]
type = "str"
default = "https://localhost:8443"
review_optional = true
help = "HTTPS origin of the agent's Django backend serving its HTTP API. Local operations bind its port on loopback; frontend and provider callback URLs are configured separately."

[fields.LLM_QUOTA_PERIOD]
type = "str"
enum = ["day", "week", "month"]
default = "week"
help = "Quota window used for subscription cost estimation. Month means the current UTC calendar month. The selected provider reads only a matching window; an unsupported window is not replaced with another period. API-key authentication uses list prices instead. Override to match the selected provider/account allocation."

[fields.LLM_PAY_PERIOD]
type = "str"
enum = ["day", "week", "month"]
default = "month"
help = "Payment/allocation period for subscription estimates. Month means the current UTC calendar month; fractional weeks are its days divided by seven. API-key authentication uses list prices instead."

[fields.LLM_PAY_PERIOD_LIMIT]
type = "float"
validation = "nonnegative"
default = 100.0
help = "USD payment/allocation limit per LLM_PAY_PERIOD for subscription estimates. A quota delta consumes that fraction of the payment allocated to one quota window. This is an estimate assuming exclusive account use, not an invoice. API-key authentication uses list prices instead."

[fields.TEST_COST_HISTORY_DAYS]
type = "int"
validation = "positive"
default = 7
help = "Days of compatible finalized integration/E2E accounting history used for advance cost predictions and subscription calibration. Cached history appears immediately; background synchronization never starts services or login. Older records remain preserved but are outside this estimation window."
